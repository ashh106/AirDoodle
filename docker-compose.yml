services:
  postgres:
    image: postgres:16-alpine
    container_name: airdoodle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airdoodle
      POSTGRES_PASSWORD: airdoodle_password
      POSTGRES_DB: airdoodle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airdoodle -d airdoodle"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airdoodle-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://airdoodle:${POSTGRES_PASSWORD:-airdoodle_password}@postgres:5432/airdoodle
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in production}
      PING_MESSAGE: "AirDoodle Web & C++ Geometry Engine Active"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: airdoodle_postgres_data
